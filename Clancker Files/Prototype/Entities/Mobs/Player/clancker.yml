- type: entity
  id: MobClanck
  parent: PlayerClanckerHumanoidBase
  name: Urist McGear
  description: um amontoado de microengrenagens movidas a combustível de solda.
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    program: 52
  - type: SwappableInstrument
    instrumentList:
      "Daw": { 0: 0 }
  - type: UserInterface
    interfaces:
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      # Goobstation - changelings (technically, IPCs cant be a ling, but whatever)
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
      enum.HereticLivingHeartKey.Key: # goob edit - heretics
        type: LivingHeartMenuBoundUserInterface
      enum.WizardTeleportUiKey.Key: # Goobstation - wizard
        type: WizardTeleportBoundUserInterface
        requireInputValidation: false
      enum.SurgeryUIKey.Key: # Shitmed
        type: SurgeryBui
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  - type: StandingState
  - type: Damageable
    damageContainer: SiliconRadiation
    damageModifierSet: Clancker
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      140: Dead
    stateAlertDict:
      Alive: BorgHealth
      Dead: BorgDead
  - type: TypingIndicator
    proto: robot
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior { }
  - type: SlowOnDamage
    speedModifierThresholds:
      70: 0.7
      100: 0.5
      130: 0.3
  - type: SiliconDownOnDead
  - type: Inventory
    templateId: clancker
  - type: GuideHelp
    guides:
    - Clancker
  - type: FuelConsume
  - type: FuelSlot
  - type: ContainerFill
    containers:
      fuel-slot:
				- EntBeakerWeldingFuel
  -	type:	Locking
  
  
- type: entity
  save: false
  name: Urist McGear
  parent: MobHumanDummy
  id: MobClanckerDummy
  categories: [ HideSpawnMenu ] # Goobstation
  description: Uma lata velha qualquer.
  components:
  - type: HumanoidAppearance
    species: Clancker
  - type: Inventory
    templateId: clancker
