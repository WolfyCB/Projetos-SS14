- type: reagent
  id: Epinebone
  name: Epinebone
  group: Medicine
  desc: Um composto que ajuda na regeneração óssea e cura de queimaduras leves.
  physicalDesc: viscoso
  color: "FFFFFF"
  reactiveEffects:
    overdose:
      threshold: 15
      effects:
        - !type:ModifyHealth
          amount: -1
          damageType: Poison
    normal:
      effects:
        - !type:HealBoneDamage
          amount: 0.5
          damageType: Blunt
        - !type:HealBoneDamage
          amount: 0.5
          damageType: Burn

